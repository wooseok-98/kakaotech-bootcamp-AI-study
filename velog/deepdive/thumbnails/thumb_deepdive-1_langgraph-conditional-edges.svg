<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#db2777"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint node-graph motif (top-right) -->
  <g opacity="0.16" stroke="#ffffff" stroke-width="3" fill="none">
    <circle cx="1010" cy="120" r="26" fill="#ffffff" fill-opacity="0.5"/>
    <circle cx="1120" cy="230" r="22"/>
    <circle cx="905" cy="235" r="22"/>
    <line x1="1010" y1="146" x2="905" y2="213"/>
    <line x1="1010" y1="146" x2="1120" y2="208"/>
  </g>

  <!-- eyebrow -->
  <text x="600" y="212" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="8" fill="#ffffff" fill-opacity="0.72">LANGGRAPH · DEEP DIVE</text>

  <!-- main title -->
  <text x="600" y="318" text-anchor="middle" font-size="86" font-weight="800" fill="#ffffff">Conditional Edges</text>

  <!-- divider -->
  <rect x="520" y="360" width="160" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.55"/>

  <!-- subtitle -->
  <text x="600" y="440" text-anchor="middle" font-size="42" font-weight="600" fill="#ffffff" fill-opacity="0.95">동적 흐름 제어와 오설계 시 실패 분석</text>
</svg>
