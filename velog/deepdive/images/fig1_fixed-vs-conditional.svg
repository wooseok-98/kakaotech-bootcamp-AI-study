<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="arrGray" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#9ca3af"/></marker>
    <marker id="arrPurple" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <line x1="600" y1="40" x2="600" y2="480" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- LEFT: fixed edge -->
  <text x="300" y="70" text-anchor="middle" font-size="30" font-weight="700" fill="#374151">고정 엣지 (add_edge)</text>
  <text x="300" y="105" text-anchor="middle" font-size="19" fill="#6b7280">컴파일 시점에 행선지 고정 · 언제나 같은 경로</text>

  <rect x="200" y="160" width="200" height="72" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="300" y="204" text-anchor="middle" font-size="24" font-weight="600" fill="#1f2937">retrieve</text>

  <line x1="300" y1="232" x2="300" y2="332" stroke="#9ca3af" stroke-width="3" marker-end="url(#arrGray)"/>

  <rect x="200" y="340" width="200" height="72" rx="14" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
  <text x="300" y="384" text-anchor="middle" font-size="24" font-weight="600" fill="#1f2937">generate</text>

  <!-- RIGHT: conditional edge -->
  <text x="900" y="70" text-anchor="middle" font-size="30" font-weight="700" fill="#6d28d9">조건부 엣지 (add_conditional_edges)</text>
  <text x="900" y="105" text-anchor="middle" font-size="19" fill="#7c3aed">실행 중 State를 보고 매번 다음 노드 결정</text>

  <rect x="800" y="150" width="200" height="72" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="900" y="194" text-anchor="middle" font-size="24" font-weight="600" fill="#4c1d95">check</text>

  <path d="M865,222 L775,338" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrPurple)"/>
  <rect x="690" y="263" width="86" height="34" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="733" y="287" text-anchor="middle" font-size="18" font-weight="600" fill="#7c3aed">retry</text>

  <path d="M935,222 L1015,338" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrPurple)"/>
  <rect x="1024" y="263" width="82" height="34" rx="8" fill="#ffffff" stroke="#7c3aed"/>
  <text x="1065" y="287" text-anchor="middle" font-size="18" font-weight="600" fill="#7c3aed">done</text>

  <rect x="680" y="346" width="180" height="72" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="770" y="390" text-anchor="middle" font-size="24" font-weight="600" fill="#4c1d95">work</text>

  <rect x="940" y="346" width="150" height="72" rx="36" fill="#fce7f3" stroke="#db2777" stroke-width="2.5"/>
  <text x="1015" y="390" text-anchor="middle" font-size="24" font-weight="700" fill="#9d174b">END</text>
</svg>
