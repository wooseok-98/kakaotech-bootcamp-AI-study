<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <marker id="mA" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#7c3aed"/></marker>
    <marker id="mP" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#db2777"/></marker>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <line x1="470" y1="60" x2="470" y2="560" stroke="#e5e7eb" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- LEFT: single agent -->
  <text x="235" y="72" text-anchor="middle" font-size="28" font-weight="800" fill="#5b21b6">단일 에이전트</text>
  <text x="235" y="102" text-anchor="middle" font-size="17" fill="#7c3aed">= 그래프 하나</text>

  <rect x="70" y="150" width="330" height="300" rx="16" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="235" y="182" text-anchor="middle" font-size="16" fill="#a78bfa">하나의 컴파일된 그래프</text>

  <rect x="140" y="210" width="190" height="70" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="235" y="252" text-anchor="middle" font-size="22" font-weight="700" fill="#4c1d95">agent</text>
  <rect x="140" y="350" width="190" height="70" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="235" y="392" text-anchor="middle" font-size="22" font-weight="700" fill="#4c1d95">tools</text>

  <line x1="205" y1="280" x2="205" y2="348" stroke="#7c3aed" stroke-width="3" marker-end="url(#mA)"/>
  <path d="M300,350 C360,320 360,240 300,212" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#mA)"/>
  <text x="150" y="322" font-size="14" fill="#7c3aed">호출</text>
  <text x="330" y="298" font-size="14" fill="#7c3aed">관찰</text>

  <!-- RIGHT: multi agent -->
  <text x="830" y="72" text-anchor="middle" font-size="28" font-weight="800" fill="#9d174b">멀티 에이전트</text>
  <text x="830" y="102" text-anchor="middle" font-size="17" fill="#db2777">= 에이전트(그래프)를 노드로 엮은 상위 그래프</text>

  <!-- supervisor -->
  <rect x="700" y="140" width="260" height="66" rx="14" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
  <text x="830" y="180" text-anchor="middle" font-size="22" font-weight="800" fill="#9d174b">Supervisor</text>

  <!-- three sub-agent boxes (graph-in-graph) -->
  <g>
    <!-- agent 1 -->
    <rect x="530" y="300" width="200" height="210" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="630" y="328" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">검색 에이전트</text>
    <rect x="558" y="346" width="144" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="630" y="379" text-anchor="middle" font-size="17" font-weight="600" fill="#4c1d95">agent</text>
    <rect x="558" y="430" width="144" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="630" y="463" text-anchor="middle" font-size="17" font-weight="600" fill="#4c1d95">tools</text>
    <line x1="612" y1="398" x2="612" y2="428" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mA)"/>
    <path d="M688,430 C716,410 716,368 688,350" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#mA)"/>
  </g>
  <g>
    <!-- agent 2 -->
    <rect x="748" y="300" width="164" height="210" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="830" y="328" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">코딩 에이전트</text>
    <rect x="768" y="346" width="124" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="830" y="379" text-anchor="middle" font-size="16" font-weight="600" fill="#4c1d95">agent</text>
    <rect x="768" y="430" width="124" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="830" y="463" text-anchor="middle" font-size="16" font-weight="600" fill="#4c1d95">tools</text>
    <line x1="812" y1="398" x2="812" y2="428" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mA)"/>
    <path d="M878,430 C902,410 902,368 878,350" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#mA)"/>
  </g>
  <g>
    <!-- agent 3 -->
    <rect x="930" y="300" width="164" height="210" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="1012" y="328" text-anchor="middle" font-size="18" font-weight="700" fill="#5b21b6">번역 에이전트</text>
    <rect x="950" y="346" width="124" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1012" y="379" text-anchor="middle" font-size="16" font-weight="600" fill="#4c1d95">agent</text>
    <rect x="950" y="430" width="124" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1012" y="463" text-anchor="middle" font-size="16" font-weight="600" fill="#4c1d95">tools</text>
    <line x1="994" y1="398" x2="994" y2="428" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#mA)"/>
    <path d="M1060,430 C1084,410 1084,368 1060,350" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#mA)"/>
  </g>

  <!-- supervisor routes -->
  <path d="M770,206 L640,296" stroke="#db2777" stroke-width="3" fill="none" marker-end="url(#mP)"/>
  <path d="M830,206 L830,296" stroke="#db2777" stroke-width="3" fill="none" marker-end="url(#mP)"/>
  <path d="M890,206 L1000,296" stroke="#db2777" stroke-width="3" fill="none" marker-end="url(#mP)"/>
  <text x="830" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#db2777">누구에게 보낼까 (조건부 엣지)</text>

  <text x="830" y="556" text-anchor="middle" font-size="17" font-weight="600" fill="#6b7280">노드 = 에이전트(그래프)  ·  "그래프 안의 그래프"</text>
</svg>
